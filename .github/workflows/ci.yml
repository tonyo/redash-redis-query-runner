name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the tools pinned in mise.toml (python, ruff, ty, pre-commit); the hooks call them via mise.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.8.14
      - run: mise exec -- pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The test service reads .env; this makes a throwaway one with random secrets.
      - run: sh scripts/setup-env.sh
      # Same as `mise run test`: unit and integration tests in a container made from the Redash image.
      - run: docker compose --profile test run --rm --build test
      - if: always()
        run: docker compose --profile test down --volumes
